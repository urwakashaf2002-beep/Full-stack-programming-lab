<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asynchronous Data Loader</title>
  <link rel="stylesheet" href="DataLoader.css">
</head>
<body>

  <header>
    <h1>🌐 Asynchronous Data Loader</h1>
  </header>

  <main>
    <section class="table-section">
      <table id="user-table">
        <thead>
          <tr>
            <th>User ID</th>
            <th>User Name</th>
          </tr>

        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>© 2026 Data Loader System</p>
  </footer>

  <script src="DataLoader.js"></script>

</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Color Generator</title>
<link rel="stylesheet" href="ColorBoxGenerator.css">
</head>
<body>

<div class="wrapper">
<h2>Nina Color Generator</h2>

<div class="inputs">
<input type="text" id="c1" placeholder="Color 1">
<input type="text" id="c2" placeholder="Color 2">
<input type="text" id="c3" placeholder="Color 3">
</div>

<button onclick="addColors()">Generate</button>
<button onclick="clearBoxes()" class="clear">Clear</button>

<div id="boxes"></div>

<div id="info" class="info"></div>
</div>

<script src="ColorBoxGenerator.js"></script>
</body>
</html>

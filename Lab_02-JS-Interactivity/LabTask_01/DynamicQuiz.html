<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Quiz</title>
<link rel="stylesheet" href="DynamicQuiz.css">
</head>
<body>

<div class="container">
    <h1>JavaScript Quiz</h1>

    <div class="question">
        <p>1. What does JS stand for?</p>
        <input type="text" id="q1" placeholder="Your answer">
    </div>

    <div class="question">
        <p>2. Which keyword declares block scope variable?</p>
        <input type="text" id="q2" placeholder="Your answer">
    </div>

    <div class="question">
        <p>3. What method selects element by ID?</p>
        <input type="text" id="q3" placeholder="Your answer">
    </div>

    <div class="buttons">
        <button onclick="submitQuiz()">Submit</button>
        <button class="reset" onclick="resetQuiz()">Reset</button>
    </div>

    <div id="result" class="result"></div>
</div>

<script src="DynamicQuiz.js"></script>
</body>
</html>
